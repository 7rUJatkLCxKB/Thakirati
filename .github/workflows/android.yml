name: Build Thakirati APK

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Prepare project
    run: |
      unzip -o ThakiratiAndroidProject.zip -d project
      find project -type f -name settings.gradle -o -name settings.gradle.kts

  - name: Build APK
    run: |
      SETTINGS=$(find project -type f -name settings.gradle -o -name settings.gradle.kts | head -n 1)
      if [ -z "$SETTINGS" ]; then
        echo "ERROR: settings.gradle not found"
        exit 1
      fi
      cd "$(dirname "$SETTINGS")"
      gradle assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Thakirati-APK
      path: project/**/build/outputs/apk/debug/*.apk
      if-no-files-found: error
