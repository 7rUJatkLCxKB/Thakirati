name: Build Thakirati APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare project
        run: |
          unzip -o ThakiratiAndroidProject.zip -d project
          find project -name settings.gradle.kts -print
          PROJECT_DIR="$(find project -name settings.gradle.kts -printf '%h\n' | head -n 1)"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          
          
          - name: Set up Java
          uses: actions/setup-java@v4
          with:
          distribution: temurin
          java-version: '17'

      - name: Build APK  
        run: |


      
         GRADLEW="$(find project -type f -name gradlew | head -n 1)"
         if [ -z "$GRADLEW" ]; then
         echo "ERROR: gradlew not found in project ZIP."
         find project -maxdepth 5 -type f | head -n 100
         exit 1
         fi
         cd "$(dirname "$GRADLEW")"
         chmod +x gradlew
         ./gradlew assembleDebug
       
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Thakirati-APK
          path: project/**/*.apk
